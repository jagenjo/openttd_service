; Plantilla de configuración del servidor. El panel (webserver/game.js) la combina con
; los ajustes del panel y la escribe en runtime/server/ en cada arranque.
; OpenTTD completa el resto de ajustes con sus valores por defecto.

[economy]
; 1 = "wallclock": la economía va en periodos de 12 min reales y el calendario
; se desacopla. 1440 minutos por año de calendario = 1 año de juego por día real.
timekeeping_units = 1
minutes_per_calendar_year = 1440
; La inflación avanza por periodo económico (12 min), no por año de calendario:
; con años de un día sería desproporcionada.
inflation = false
type = 1

[game_creation]
starting_year = 1950
map_x = 8
map_y = 8
landscape = temperate

[network]
server_name = OpenTTD Slow Time
; Nombre con el que el servidor aparece en el chat del juego (mensajes de la web).
client_name = Web
server_port = 3979
server_game_type = local
max_companies = 15
max_clients = 25
autoclean_companies = false
min_active_clients = 0
pause_on_join = false

[gui]
autosave_interval = 10
